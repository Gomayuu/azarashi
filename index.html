<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>3D FPS（VALORANT風）</title>
<style>
body { margin: 0; overflow: hidden; }
canvas { display: block; }
#info {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  font-family: sans-serif;
}
</style>
</head>
<body>
<div id="info">クリックして開始 / WASD移動 / SPACE射撃</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// プレイヤー
let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();

// 床
let floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshBasicMaterial({color: 0x444444})
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// 壁（VALORANT風の簡易マップ）
function createBox(x,y,z,color=0x888888){
  let box = new THREE.Mesh(
    new THREE.BoxGeometry(10,10,10),
    new THREE.MeshBasicMaterial({color})
  );
  box.position.set(x,y,z);
  scene.add(box);
}
createBox(20,5,-20);
createBox(-20,5,-30);
createBox(0,5,-50);

// 敵（NPC）
let enemy = new THREE.Mesh(
  new THREE.BoxGeometry(5,5,5),
  new THREE.MeshBasicMaterial({color: 0xff0000})
);
enemy.position.set(0,2,-30);
scene.add(enemy);

// カメラ初期位置
camera.position.set(0, 5, 10);

// マウス操作
let yaw = 0;
let pitch = 0;

document.body.addEventListener("click", () => {
  document.body.requestPointerLock();
});

document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement === document.body) {
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  }
});

// キー入力
let keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

// 弾
let bullets = [];

function shoot(){
  let bullet = new THREE.Mesh(
    new THREE.SphereGeometry(0.5),
    new THREE.MeshBasicMaterial({color: 0xffff00})
  );
  bullet.position.copy(camera.position);

  let dir = new THREE.Vector3(0,0,-1);
  dir.applyEuler(new THREE.Euler(pitch, yaw, 0));
  bullet.velocity = dir.multiplyScalar(2);

  scene.add(bullet);
  bullets.push(bullet);
}

// 射撃（スペース）
document.addEventListener("keydown", e => {
  if (e.code === "Space") shoot();
});

// ループ
function animate(){
  requestAnimationFrame(animate);

  // 視点
  camera.rotation.set(pitch, yaw, 0);

  // 移動
  direction.set(0,0,0);
  if(keys["KeyW"]) direction.z -= 1;
  if(keys["KeyS"]) direction.z += 1;
  if(keys["KeyA"]) direction.x -= 1;
  if(keys["KeyD"]) direction.x += 1;

  direction.normalize();

  let move = direction.clone().applyEuler(new THREE.Euler(0, yaw, 0));
  camera.position.add(move.multiplyScalar(0.5));

  // 敵AI（追いかける）
  let toPlayer = new THREE.Vector3().subVectors(camera.position, enemy.position).normalize();
  enemy.position.add(toPlayer.multiplyScalar(0.1));

  // 弾更新
  bullets.forEach((b, i) => {
    b.position.add(b.velocity);

    // 当たり判定
    if (b.position.distanceTo(enemy.position) < 3) {
      scene.remove(enemy);
      enemy.position.set(Math.random()*50-25,2,Math.random()*-50);
      scene.add(enemy);
    }
  });

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
