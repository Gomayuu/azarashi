<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>本格FPSバトロワ</title>
<style>
body { margin:0; overflow:hidden; background:black; }
#ui { position:absolute; top:10px; left:10px; color:white; font-family:sans-serif; }
</style>
</head>
<body>
<div id="ui">クリックでロックオン（FPS操作）</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// FPS操作
const controls = { enabled:false };
document.body.addEventListener("click", ()=>{
  document.body.requestPointerLock();
  controls.enabled = true;
});

document.addEventListener("mousemove", e=>{
  if(!controls.enabled) return;
  camera.rotation.y -= e.movementX * 0.002;
  camera.rotation.x -= e.movementY * 0.002;
});

// プレイヤー
const player = new THREE.Object3D();
player.position.y = 1.5;
player.hp=100;
player.ammo=30;
player.kills=0;
scene.add(player);

camera.position.set(0,1.5,0);
player.add(camera);

// 床
const floor = new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshBasicMaterial({color:0x222222, side:THREE.DoubleSide}));
floor.rotation.x = Math.PI/2;
scene.add(floor);

// 移動
let keys={};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

// 敵
let enemies=[];
function spawnEnemy(){
  const e = new THREE.Mesh(new THREE.BoxGeometry(1,2,1), new THREE.MeshBasicMaterial({color:0xff0000}));
  e.position.set((Math.random()-0.5)*200,1,(Math.random()-0.5)*200);
  e.hp=5;
  scene.add(e);
  enemies.push(e);
}
setInterval(spawnEnemy,1500);

// 弾
let bullets=[];
document.addEventListener("click",()=>{
  if(player.ammo<=0) return;
  player.ammo--;

  const b = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color:0xffff00}));
  b.position.copy(camera.getWorldPosition(new THREE.Vector3()));

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  b.velocity = dir.multiplyScalar(2);

  scene.add(b);
  bullets.push(b);
});

// 建築（前方に壁）
document.addEventListener("contextmenu", e=>{
  e.preventDefault();
  const wall = new THREE.Mesh(new THREE.BoxGeometry(3,3,0.5), new THREE.MeshBasicMaterial({color:0x888888}));

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  wall.position.copy(player.position.clone().add(dir.multiplyScalar(5)));
  wall.position.y = 1.5;

  scene.add(wall);
});

// ストーム
let storm=200;

function animate(){
  requestAnimationFrame(animate);

  let speed=0.3;
  if(keys["w"]) player.translateZ(-speed);
  if(keys["s"]) player.translateZ(speed);
  if(keys["a"]) player.translateX(-speed);
  if(keys["d"]) player.translateX(speed);

  bullets.forEach((b,bi)=>{
    b.position.add(b.velocity);

    enemies.forEach((e,ei)=>{
      if(b.position.distanceTo(e.position)<1){
        e.hp--;
        scene.remove(b);
        bullets.splice(bi,1);
        if(e.hp<=0){
          scene.remove(e);
          enemies.splice(ei,1);
          player.kills++;
        }
      }
    });
  });

  enemies.forEach(e=>{
    let dir = player.position.clone().sub(e.position).normalize();
    e.position.add(dir.multiplyScalar(0.08));
    if(e.position.distanceTo(player.position)<1.5){
      player.hp -= 0.3;
    }
  });

  storm -= 0.05;
  let dist = Math.sqrt(player.position.x**2 + player.position.z**2);
  if(dist > storm) player.hp -= 0.5;

  document.getElementById("ui").innerHTML = `HP:${Math.floor(player.hp)} 弾:${player.ammo} キル:${player.kills}`;

  if(player.hp<=0){ alert("敗北"); location.reload(); }
  if(player.kills>=30){ alert("勝利"); location.reload(); }

  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
