<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロセカ風 音ゲー</title>
<style>
body {
  margin: 0;
  background: linear-gradient(#0a0a0a, #1a1a2e);
  color: white;
  font-family: sans-serif;
  text-align: center;
}

#game {
  position: relative;
  width: 420px;
  height: 650px;
  margin: 20px auto;
  background: rgba(0,0,0,0.8);
  border: 2px solid #fff;
  overflow: hidden;
}

.lane {
  position: absolute;
  width: 25%;
  height: 100%;
  border-left: 1px solid #444;
}

.note {
  position: absolute;
  width: 25%;
  height: 20px;
  background: linear-gradient(cyan, blue);
  border-radius: 6px;
  box-shadow: 0 0 10px cyan;
}

#judgeLine {
  position: absolute;
  bottom: 80px;
  width: 100%;
  height: 6px;
  background: red;
}

#combo {
  font-size: 28px;
  margin-top: 10px;
}

#result {
  font-size: 24px;
  height: 30px;
}

button {
  padding: 10px 20px;
  font-size: 18px;
  margin-top: 10px;
}
</style>
</head>
<body>

<h1>プロセカ風 音ゲー</h1>
<div id="combo">Combo: 0</div>
<div id="result"></div>
<button onclick="startGame()">START</button>

<div id="game">
  <div id="judgeLine"></div>
</div>

<script>
const game = document.getElementById("game");
const comboDisplay = document.getElementById("combo");
const resultDisplay = document.getElementById("result");

const BPM = 154; // 千本桜っぽい速さ
const beatInterval = 60000 / BPM;

let notes = [];
let combo = 0;
let playing = false;
let startTime;

// 譜面（秒単位）
const chart = [];
for (let i = 0; i < 100; i++) {
  chart.push({
    time: i * (beatInterval / 1000),
    lane: Math.floor(Math.random() * 4)
  });
}

// ノーツ生成
function spawnNote(lane) {
  const note = document.createElement("div");
  note.className = "note";
  note.style.left = lane * 25 + "%";
  note.style.top = "0px";
  note.dataset.lane = lane;
  game.appendChild(note);
  notes.push(note);
}

// 判定
function judge(noteY) {
  if (noteY > 540 && noteY < 580) return "PERFECT";
  if (noteY > 500 && noteY < 620) return "GOOD";
  return "MISS";
}

// 入力
document.addEventListener("keydown", (e) => {
  if (!playing) return;

  const keyMap = { d:0, f:1, j:2, k:3 };
  const lane = keyMap[e.key];
  if (lane === undefined) return;

  for (let i = 0; i < notes.length; i++) {
    let note = notes[i];
    if (parseInt(note.dataset.lane) === lane) {
      let y = parseFloat(note.style.top);
      let result = judge(y);

      if (result !== "MISS") {
        combo++;
        resultDisplay.textContent = result;
        note.remove();
        notes.splice(i, 1);
        break;
      } else {
        combo = 0;
        resultDisplay.textContent = "MISS";
      }
    }
  }

  comboDisplay.textContent = "Combo: " + combo;
});

// 更新処理
function update() {
  if (!playing) return;

  const currentTime = (Date.now() - startTime) / 1000;

  // ノーツ出現
  chart.forEach((n, i) => {
    if (!n.spawned && currentTime >= n.time) {
      spawnNote(n.lane);
      n.spawned = true;
    }
  });

  // ノーツ移動
  notes.forEach((note, index) => {
    let y = parseFloat(note.style.top);
    y += 5;
    note.style.top = y + "px";

    if (y > 650) {
      note.remove();
      notes.splice(index, 1);
      combo = 0;
    }
  });

  comboDisplay.textContent = "Combo: " + combo;
  requestAnimationFrame(update);
}

// スタート
function startGame() {
  notes = [];
  combo = 0;
  resultDisplay.textContent = "";
  chart.forEach(n => n.spawned = false);

  startTime = Date.now();
  playing = true;
  update();
}
</script>

</body>
</html>
