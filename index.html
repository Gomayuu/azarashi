<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seal Battle Royale</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
}
#gameCanvas {
  display: block;
  background: linear-gradient(#87ceeb, #e0f7ff);
}
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  font-size: 18px;
  text-shadow: 1px 1px 2px black;
}
#startScreen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
}
button {
  padding: 10px 20px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="ui">HP: <span id="hp">100</span> | スコア: <span id="score">0</span></div>
<div id="startScreen">
  <h1>Seal Battle Royale</h1>
  <button onclick="startGame()">スタート</button>
</div>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let keys = {};
let bullets = [];
let enemies = [];
let score = 0;
let gameRunning = false;

const player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  size: 20,
  speed: 5,
  hp: 100
};

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);
document.addEventListener('click', shoot);

function shoot(e) {
  if (!gameRunning) return;
  const angle = Math.atan2(e.clientY - player.y, e.clientX - player.x);
  bullets.push({
    x: player.x,
    y: player.y,
    dx: Math.cos(angle) * 10,
    dy: Math.sin(angle) * 10
  });
}

function spawnEnemy() {
  const x = Math.random() * canvas.width;
  const y = Math.random() * canvas.height;
  enemies.push({ x, y, size: 20, hp: 30 });
}

setInterval(() => {
  if (gameRunning) spawnEnemy();
}, 1500);

function update() {
  if (!gameRunning) return;

  if (keys['w']) player.y -= player.speed;
  if (keys['s']) player.y += player.speed;
  if (keys['a']) player.x -= player.speed;
  if (keys['d']) player.x += player.speed;

  bullets.forEach(b => {
    b.x += b.dx;
    b.y += b.dy;
  });

  enemies.forEach(e => {
    const angle = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(angle) * 2;
    e.y += Math.sin(angle) * 2;

    const dist = Math.hypot(player.x - e.x, player.y - e.y);
    if (dist < player.size + e.size) {
      player.hp -= 1;
    }
  });

  bullets.forEach((b, bi) => {
    enemies.forEach((e, ei) => {
      const dist = Math.hypot(b.x - e.x, b.y - e.y);
      if (dist < e.size) {
        e.hp -= 10;
        bullets.splice(bi, 1);
        if (e.hp <= 0) {
          enemies.splice(ei, 1);
          score += 10;
        }
      }
    });
  });

  document.getElementById('hp').textContent = player.hp;
  document.getElementById('score').textContent = score;

  if (player.hp <= 0) {
    gameRunning = false;
    alert('ゲームオーバー！スコア: ' + score);
    location.reload();
  }
}

function drawSeal(x, y, size, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, size, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'black';
  ctx.beginPath();
  ctx.arc(x - 5, y - 5, 3, 0, Math.PI * 2);
  ctx.arc(x + 5, y - 5, 3, 0, Math.PI * 2);
  ctx.fill();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawSeal(player.x, player.y, player.size, 'white');

  bullets.forEach(b => {
    ctx.fillStyle = 'yellow';
    ctx.fillRect(b.x, b.y, 5, 5);
  });

  enemies.forEach(e => {
    drawSeal(e.x, e.y, e.size, 'gray');
  });
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  gameRunning = true;
  gameLoop();
}
</script>
</body>
</html>
